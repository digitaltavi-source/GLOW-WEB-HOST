name: validate-public-host

on:
  push:
    branches: [main, sandbox]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Audit high-severity dependency findings
        run: npm audit --audit-level=high
      - name: Build and run source-derived regression
        run: npm test
